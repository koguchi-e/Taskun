name: taskun_dev

services:
  web:
    build:
      context: .
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      RAILS_ENV: development
      PORT: "3000"
      RUBYOPT: -rlogger
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules

volumes:
  bundle:
  node_modules:
