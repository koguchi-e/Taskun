name: Rails CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Rubyをセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: yarn

      - name: JavaScript依存関係をインストール
        run: npm install --global yarn@1.22.22 && yarn install --frozen-lockfile

      - name: テストDBを準備
        run: bundle exec rails db:prepare

      - name: JavaScriptをコンパイル
        run: bundle exec rails shakapacker:compile

      - name: RSpecを実行
        run: bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Rubyをセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true

      - name: RuboCopを実行
        run: bundle exec rubocop

  zeitwerk:
    name: Zeitwerkチェック
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Rubyをセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true

      - name: Zeitwerkチェックを実行
        run: bundle exec rails zeitwerk:check
