name: RSpec

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rspec:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test

    steps:
      - uses: actions/checkout@v6

      - name: Rubyをセットアップ
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.2"
          bundler-cache: true

      - name: テストDBを準備
        run: bundle exec rails db:prepare

      - name: RSpecを実行
        run: bundle exec rspec
